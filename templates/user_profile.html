<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль {{ profile_user }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a href="/" class="logo">
        <img src="/static/localka.png" alt="Logo" class="logo-icon">
    </a>

    <div class="page">
        <div class="top">
            <div class="avatar">
                {% if avatar %}
                    <img src="{{ avatar }}" alt="Аватар">
                {% else %}
                    {{ profile_user[0] }}
                {% endif %}
            </div>
            <div>
                <h1 style="margin:0 0 8px 0;">{{ profile_user }}</h1>
                <div class="actions">
                    <a href="/success" class="btn">Мой профиль</a>
                    <a href="/message?recipient={{ profile_user }}" class="btn">Написать сообщение</a>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Фотографии {{ profile_user }}</h3>
            <div class="gallery">
                {% if photos %}
                    {% for photo in photos %}
                        <div class="photo">
                            <img src="{{ photo }}" alt="Фото">
                        </div>
                    {% endfor %}
                {% else %}
                    <p>У пользователя пока нет фотографий.</p>
                {% endif %}
            </div>
        </div>
    </div>
    <div id="viewer" class="viewer">
    <span class="close">&times;</span>
    <img class="viewer-img">
</div>
<script>
const viewer = document.getElementById('viewer');
const viewerImg = viewer.querySelector('.viewer-img');
const closeBtn = viewer.querySelector('.close');

document.querySelectorAll('.photo img').forEach(img => {
    img.addEventListener('click', () => {
        viewer.classList.add('show');
        viewerImg.src = img.src;
    });
});

closeBtn.onclick = () => viewer.classList.remove('show');

viewer.onclick = (e) => {
    if (e.target === viewer) viewer.classList.remove('show');
};
</script>
</body>
</html>
